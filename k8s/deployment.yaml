apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratehub-frontend
  namespace: production
  labels:
    app: ratehub-frontend
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ratehub-frontend
  template:
    metadata:
      labels:
        app: ratehub-frontend
        environment: production
    spec:
      containers:
      - name: ratehub-frontend
        image: your-docker-registry.com/ratehub-frontend:latest  # Update with your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: NODE_ENV
          value: "production"
      imagePullSecrets:
      - name: docker-registry-secret  # Create this secret in your cluster

