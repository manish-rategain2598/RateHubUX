apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratehubux
  namespace: ratehubux
  labels:
    app: ratehubux
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ratehubux
  template:
    metadata:
      labels:
        app: ratehubux
    spec:
      containers:
        - name: ratehubux
          image: registry.digitalocean.com/mhs/ratehubux:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
