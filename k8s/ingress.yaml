apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ratehub-frontend-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If using cert-manager for SSL
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - staging-ratehub.yourdomain.com  # Update with your staging domain
    secretName: ratehub-staging-tls-secret
  rules:
  - host: staging-ratehub.yourdomain.com  # Update with your staging domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ratehub-frontend-service
            port:
              number: 80

